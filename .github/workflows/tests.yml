name: Tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  web:
    name: App checks (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: App unit tests
        run: npm test
      - name: TypeScript checks
        run: npm run typecheck
      - name: Production build
        run: npm run build

  engine:
    name: Rust tests and equation report
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust and PDF tools
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-extra lmodern
      - name: Rust tests and generated PDF report
        run: bash engine/run-tests.sh
      - name: Upload engine report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-report
          path: |
            engine/report/report.tex
            engine/report/report.pdf
          retention-days: 14

  browser:
    name: Chrome browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      E2E_PORT: '3127'
      E2E_BASE_URL: http://localhost:3127
      E2E_OLLAMA_BASE_URL: http://127.0.0.1:9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Chrome and system dependencies
        run: npx playwright install --with-deps chrome
      - name: Production build
        run: npm run build
      - name: Browser tests
        run: npx playwright test --config testing/e2e/playwright.config.ts
      - name: Upload browser reports, videos and failure traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-results
          path: |
            testing/media/playwright-report/
            testing/media/test-results/
          retention-days: 14
          if-no-files-found: warn
